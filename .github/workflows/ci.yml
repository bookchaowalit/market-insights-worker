# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# worker.js is generated by publish_pages.py (bookchaowalit/career-job-scraper); src/worker.ts
# wraps it with Sentry. The node job typechecks (strict), runs the tests and does a Wrangler
# dry-run bundle. Nothing here deploys: `wrangler deploy` stays an owner action.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22"
      require-tests: true # ADR-0004: fail if the test script disappears
      # No Biome/ESLint config: lint is skipped by `auto` with a warning. Tests use node --test via
      # tsx, so there is no coverage gate (the shared gate needs vitest or jest).
      build-command: npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
